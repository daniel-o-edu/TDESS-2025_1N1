<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Responsividade - Parte 2</title>
    <style>
        /* --- Estilos do Botão e Texto (Parte 1) --- */
        button { width: 100%; padding: 10px; }
        @media (min-width: 768px) { button { width: 200px; } }
        
        p { text-align: left; font-size: 16px; margin: 20px 0; }
        @media (min-width: 1024px) { 
            p { text-align: center; font-size: 20px; } 
        }

        /* --- Estilos dos Cards (Parte 2) --- */

        /* No Mobile: Divs já são block por padrão, então ficam empilhadas */
        .container-cards {
            display: flex;
            flex-direction: column; /* Garante o empilhamento vertical */
            gap: 10px;
        }

        .card {
            background-color: #f0f0f0;
            padding: 20px;
            border: 1px solid #ccc;
            text-align: center;
        }

        /* Tablet (768px): Colocar lado a lado */
        @media (min-width: 768px) {
            .container-cards {
                flex-direction: row; /* Alinha os itens horizontalmente */
                justify-content: space-between;
            }
            .card {
                flex: 1; /* Faz as caixas terem tamanhos iguais */
            }
        }

        /* Desktop (1024px): Aumentar margem e borda */
        @media (min-width: 1024px) {
            .container-cards {
                gap: 40px; /* Aumenta a distância entre as caixas */
            }
            .card {
                border-width: 5px; /* Deixa a borda mais grossa */
                border-color: #333;
            }
        }
    </style>
</head>
<body>

    <button>Enviar</button>
    <p>Texto responsivo abaixo do botão.</p>

    <div class="container-cards">
        <div class="card">Card 1</div>
        <div class="card">Card 2</div>
        <div class="card">Card 3</div>
    </div>

</body>
</html>
